<body class="locked"><div class="arch arch-one" aria-hidden="true"></div><div class="arch arch-two" aria-hidden="true"></div><header class="gate-brand">♡ <span>致我們<small>THE MUSEUM OF US</small></span></header><main class="invitation"><span class="eyebrow">AN INVITATION, ONLY FOR YOU</span><div class="heart" aria-hidden="true">♡</div><h1>有些回憶，<br>只想和你分享。</h1><p class="intro">這座博物館，為你而亮。<br>說出我們的暗號，一起走進故事裡。</p><form id="unlock-form"><label for="passphrase">我們的第一次相遇</label><div class="input-wrap"><input id="passphrase" type="password" autocomplete="off" placeholder="輸入那一天的日期" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" required spellcheck="false" autocapitalize="off" aria-describedby="unlock-message"><button type="button" id="reveal" aria-label="顯示暗號" aria-pressed="false">顯示</button></div><button type="submit" class="unlock-button" id="unlock-submit">為我們開門 <span>↗</span></button><p id="unlock-message" role="status" aria-live="polite"></p></form><div class="invitation-foot">獻給，獨一無二的你。</div><noscript>請開啟瀏覽器的 JavaScript，才能輸入暗號與參觀展館。</noscript></main><footer class="gate-footer">OUR STORY, SAFELY KEPT. &nbsp; ♡</footer><script type="module" src="./unlock.js"></script></body></html>
